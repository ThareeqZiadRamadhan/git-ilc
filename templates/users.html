{% extends 'layout.html' %}
{% block title %}Manajemen Pengguna{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
	<h3 class="mb-0">Manajemen Pengguna</h3>
	<a href="{{ url_for('user_new') }}" class="btn btn-primary">Tambah Pengguna</a>
</div>
<table class="table table-bordered table-striped">
	<thead>
		<tr><th>Nama</th><th>Email</th><th>Role</th><th>Menu Diizinkan</th><th style="width:180px">Aksi</th></tr>
	</thead>
	<tbody>
		{% for u in users %}
		<tr>
			<td>{{ u.name }}</td>
			<td>{{ u.email }}</td>
			<td>{{ u.role }}</td>
			<td>{{ u.allowed_menus }}</td>
			<td>
				<a class="btn btn-sm btn-secondary" href="{{ url_for('user_edit', user_id=u.id) }}">Edit</a>
				<a class="btn btn-sm btn-warning" href="{{ url_for('user_change_password', user_id=u.id) }}">Ubah Password</a>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
