{% extends 'layout.html' %}
{% block title %}Pengeluaran{% endblock %}
{% block content %}
<h3 class="mb-3">Pengeluaran</h3>
<form method="post" class="row g-2 align-items-end mb-3">
	<div class="col-md-2">
		<label class="form-label">Tanggal</label>
		<input type="date" class="form-control" name="entry_date" />
	</div>
	<div class="col-md-3">
		<label class="form-label">Kategori</label>
		<select name="category_id" class="form-select">
			<option value="">- Pilih -</option>
			{% for c in categories %}
			<option value="{{ c.id }}">{{ c.name }}</option>
			{% endfor %}
		</select>
	</div>
	<div class="col-md-3">
		<label class="form-label">Jumlah</label>
		<input class="form-control currency-input" name="amount" inputmode="numeric" placeholder="0" />
	</div>
	<div class="col-md-3">
		<label class="form-label">Catatan</label>
		<input class="form-control" name="note" />
	</div>
	<div class="col-md-1">
		<button class="btn btn-primary w-100">Tambah</button>
	</div>
</form>
<table class="table table-bordered table-striped">
	<thead>
		<tr><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th class="text-end">Jumlah</th><th style="width:200px">Aksi</th></tr>
	</thead>
	<tbody>
		{% for e in expenses %}
		<tr>
			<form method="post" action="{{ url_for('expense_edit', exp_id=e.id) }}">
			<td><input type="date" name="entry_date" class="form-control form-control-sm" value="{{ e.entry_date }}" /></td>
			<td>
				<select name="category_id" class="form-select form-select-sm">
					<option value="">Tanpa</option>
					{% for c in categories %}
					<option value="{{ c.id }}" {{ 'selected' if e.category_id==c.id else '' }}>{{ c.name }}</option>
					{% endfor %}
				</select>
			</td>
			<td><input name="note" class="form-control form-control-sm" value="{{ e.note or '' }}" /></td>
			<td><input name="amount" class="form-control form-control-sm currency-input" value="{{ e.amount_cents|currency }}" /></td>
			<td>
				<div class="d-flex gap-1">
					<button class="btn btn-sm btn-success">Simpan</button>
				</div>
			</td>
			</form>
			<td class="d-none"></td>
			<td class="d-none"></td>
		</tr>
		<tr>
			<td colspan="5" class="text-end">
				<form class="d-inline" method="post" action="{{ url_for('expense_delete', exp_id=e.id) }}" onsubmit="return confirm('Hapus data?')">
					<button class="btn btn-sm btn-danger">Hapus</button>
				</form>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
